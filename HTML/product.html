<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX – Product</title>
    <link rel="stylesheet" href="product.css">
</head>

<body>

<div class="product-container">

    <!-- LEFT SIDE: ONLY ONE IMAGE -->
    <div class="product-image">
        <img src="shoe1.jpg" alt="APEX Shoes">
    </div>

    <!-- RIGHT SIDE: DETAILS -->
    <div class="product-details">

        <h1>APEX UltraBoost Runner</h1>
        <p class="price">₹4,499</p>
        <p class="tax">Inclusive of all taxes</p>

        <hr>

        <!-- SIZES -->
        <h3>Select Size</h3>
        <div class="sizes">
            <span>6</span>
            <span>7</span>
            <span>8</span>
            <span>9</span>
            <span>10</span>
        </div>

        <!-- COLORS -->
        <h3>Colors</h3>
        <div class="colors">
            <div class="color red"></div>
            <div class="color black"></div>
            <div class="color white"></div>
        </div>

        <!-- BUTTON -->
        <button class="add-cart">Add to Cart</button>

        <!-- DESCRIPTION -->
        <h3>Description</h3>
        <p class="desc">
            The APEX UltraBoost Runner offers premium comfort and performance.
            Lightweight, durable, and built for everyday running.
        </p>

        <h3>Delivery & Returns</h3>
        <p class="desc">
            Free delivery over ₹999. 7-day easy returns.
        </p>

    </div>

</div>

</body>
</html>
